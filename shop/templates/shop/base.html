<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlowCare{% endblock %}</title>
    <style>
    /* Common Styles */
    body { margin:0; font-family: 'Poppins', sans-serif; background:#f5f5f5; }
    
    /* Header Styles */
    header {
      background:#fff;
      padding:15px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:2px solid #e60073;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    .logo { font-size:1.8rem; font-weight:bold; color:#e60073; }
    nav { display:flex; gap:20px; }
    nav a { color:#222; padding:6px 10px; border-radius:6px; transition:all 0.3s; display:inline-block; text-decoration:none; }
    nav a:hover { background:#e60073; color:#fff; }

    /* Dropdown Styles */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1000;
      border-radius: 5px;
    }
    .dropdown-content a {
      color: #333;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      border-bottom: 1px solid #f1f1f1;
    }
    .dropdown-content a:hover {
      background: #e60073;
      color: white;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
    .dropdown:hover .dropbtn {
      background: #e60073;
      color: white;
    }
    </style>
</head>
<body>
    <header>
      <div class="logo">GlowCare</div>
      <nav>
        <a href="/">Home</a>
        <a href="/skin/">Skin Care</a>
        <a href="/hair/">Hair Care</a>
        <a href="/makeup/">Makeup</a>
        <a href="/cart/">Cart</a>
        
        <div class="dropdown">
          <a href="#" class="dropbtn">Orders ▾</a>
          <div class="dropdown-content">
            <a href="/orders/">My Orders</a>
            <a href="/checkout/">Checkout</a>
          </div>
        </div>
        
        {% if user.is_authenticated %}
          <a href="/logout/">Logout ({{ user.first_name }})</a>
        {% else %}
          <a href="/login/">Login</a>
          <a href="/signup/">Sign Up</a>
        {% endif %}
        <a href="/contact/">Contact</a>
      </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <!-- Common Footer -->
    </footer>
</body>
</html>
